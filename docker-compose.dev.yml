services:

  auth-backend:
    build:
      context: ./auth-backend
      dockerfile: Dockerfile.dev
    container_name: work_suite_auth_backend
    env_file:
      - ./env/dev/auth-backend.dev.env
    ports:
      - "5006:5005"
      - "8081:8080"
    environment:
      - GRADLE_USER_HOME=/app/.gradle
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
    volumes:
      - ./auth-backend:/app
      - ./shared:/shared:ro
      - auth_backend_gradle_cache:/app/.gradle
      - auth_backend_build_cache:/app/build
      - work_suite_data:/data
    command: ./gradlew bootRun -Pdebug=true --continuous --no-daemon
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./service-backend
      dockerfile: Dockerfile.dev
    container_name: work_suite_backend
    env_file:
      - ./env/dev/backend.dev.env
    ports:
      - "5005:5005"
      - "8080:8080"
    environment:
      - GRADLE_USER_HOME=/app/.gradle
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
    volumes:
      - ./service-backend:/app
      - ./shared:/shared:ro
      - backend_gradle_cache:/app/.gradle
      - backend_build_cache:/app/build
      - work_suite_data:/data
    command: ./gradlew bootRun -Pdebug=true --continuous --no-daemon
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./service-frontend
      dockerfile: Dockerfile.dev
    container_name: work_suite_app_dev
    env_file:
      - ./env/dev/frontend.dev.env
    ports:
      - "5173:5173"
    volumes:
      - ./service-frontend:/app
      - /app/node_modules
    restart: unless-stopped

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    container_name: work_suite_reverse_proxy_dev
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  postgres:
    build:
        context: ./postgres
        dockerfile: Dockerfile
    container_name: work_suite_postgres
    env_file:
      - ./env/dev/postgres.dev.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-worksuite}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: work_suite_mongodb
    env_file:
      - ./env/dev/mongo.dev.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redmine:
    image: redmine:5-alpine
    container_name: redmine_app
    ports:
      - "81:3000"
    volumes:
      - redmine_data:/usr/src/redmine/files
      - redmine_sqlite:/usr/src/redmine/sqlite
    restart: unless-stopped

volumes:
  work_suite_data:
  postgres_data:
  mongo_data:
  auth_backend_gradle_cache:
  auth_backend_build_cache:
  backend_gradle_cache:
  backend_build_cache:
  redmine_data:
  redmine_sqlite: