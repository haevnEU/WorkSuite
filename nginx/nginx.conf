user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format trace_json escape=json '{'
        '"time_local":"$time_local",'
        '"correlation_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":"$request_time"'
    '}';

    access_log /var/log/nginx/access.log trace_json;

    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 35s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=prod_api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=prod_ui_limit:10m rate=50r/s;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://picsum.photos https://*.picsum.photos data: blob:; connect-src 'self' ws: wss:;" always;
        add_header X-Correlation-ID $request_id always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location ~ ^/actuator {
            deny all;
            return 404;
        }

        proxy_intercept_errors on;

        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;

        location = /403.html {
            root /usr/share/nginx/html/errors;
            internal;
        }

        location = /404.html {
            root /usr/share/nginx/html/errors;
            internal;
        }

        location = /429.html {
            root /usr/share/nginx/html/errors;
            internal;
        }

        location = /50x.html {
            root /usr/share/nginx/html/errors;
            internal;
        }

        # SPA Frontend (Single Page Application Routing)
        location / {
            limit_req zone=prod_ui_limit burst=30 nodelay;
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://picsum.photos https://*.picsum.photos data: blob:; connect-src 'self' ws: wss:;" always;
            add_header X-Correlation-ID $request_id always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # WebSocket Gateway
        location /api/ws {
            proxy_pass http://backend:8080;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header X-Request-ID $request_id;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Authentication & User Microservice Gateway
        location ^~ /api/v1/user-service/ {
            limit_except POST GET PUT DELETE OPTIONS {
                deny all;
            }

            limit_req zone=prod_api_limit burst=25 nodelay;
            proxy_pass http://auth-backend:8080;

            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header X-Request-ID $request_id;
        }

        # Central REST API Gateway (Main Backend Monolith)
        location /api/ {
            limit_except GET POST PUT DELETE PATCH OPTIONS {
                deny all;
            }

            limit_req zone=prod_api_limit burst=25 nodelay;
            proxy_pass http://backend:8080;

            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}