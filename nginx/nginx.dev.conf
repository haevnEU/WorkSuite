map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format trace_json escape=json '{'
    '"time_local":"$time_local",'
    '"correlation_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_time":"$request_time"'
'}';

server_tokens off;

client_max_body_size 500M;
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;

client_body_timeout 60s;
client_header_timeout 60s;
send_timeout 60s;

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log trace_json;

    # Global Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com blob:; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://picsum.photos https://*.picsum.photos data: blob:; connect-src 'self' ws: wss:;" always;
    add_header X-Correlation-ID $request_id always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Actuator Block
    location ~ ^/actuator {
        deny all;
        return 404;
    }

    proxy_intercept_errors on;

    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;

    # Statische Fehlerseiten
    location = /402.html { root /usr/share/nginx/html/errors; internal; }
    location = /403.html { root /usr/share/nginx/html/errors; internal; }
    location = /404.html { root /usr/share/nginx/html/errors; internal; }
    location = /429.html { root /usr/share/nginx/html/errors; internal; }
    location = /50x.html { root /usr/share/nginx/html/errors; internal; }

    # =========================================================================
    # Swagger UI & OpenAPI Docs Routing
    # =========================================================================

    # 1. Auth & Identity Service (auth-backend)
    location = /doc/auth {
        return 301 /doc/auth/swagger-ui/index.html?url=/doc/auth/v3/api-docs;
    }

    location = /doc/auth/ {
        return 301 /doc/auth/swagger-ui/index.html?url=/doc/auth/v3/api-docs;
    }

    location /doc/auth/ {
        proxy_pass http://auth-backend:8080/;

        proxy_intercept_errors off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /doc/auth;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
    }

    # 2. Main / Service Backend (backend)
    location = /doc/service {
        return 301 /doc/service/swagger-ui/index.html?url=/doc/service/v3/api-docs;
    }

    location = /doc/service/ {
        return 301 /doc/service/swagger-ui/index.html?url=/doc/service/v3/api-docs;
    }

    location /doc/service/ {
        proxy_pass http://backend:8080/;

        proxy_intercept_errors off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /doc/service;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
    }

    # =========================================================================
    # Application & Microservice Gateways
    # =========================================================================

    location /license/plans {
        proxy_pass http://auth-backend:8080;

        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_hide_header Content-Disposition;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ws {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Request-ID $request_id;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/v1/user-service/ {
        proxy_pass http://auth-backend:8080;

        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Request-ID $request_id;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}