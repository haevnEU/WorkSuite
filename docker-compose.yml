services:

  proxy:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    env_file:
      - ./env/prod/frontend.prod.env
    container_name: work_suite_reverse_proxy
    ports:
      - "81:80"
    depends_on:
      auth-backend:
        condition: service_started
      backend:
        condition: service_started
    restart: always

  auth-backend:
    build:
      context: ./auth-backend
      dockerfile: Dockerfile
    container_name: work_suite_auth_backend
    env_file:
      - ./env/prod/auth-backend.prod.env
    volumes:
      - work_suite_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: always

  backend:
    build:
      context: ./service-backend
      dockerfile: Dockerfile
    container_name: work_suite_backend
    env_file:
      - ./env/prod/backend.prod.env
    volumes:
      - work_suite_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: work_suite_postgres
    env_file:
      - ./env/prod/postgres.prod.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-worksuite}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  mongodb:
    image: mongo:7.0
    container_name: work_suite_mongodb
    env_file:
      - ./env/prod/mongo.prod.env
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  work_suite_data:
  postgres_data:
  mongo_data:
    